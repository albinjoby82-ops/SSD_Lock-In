<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="680" height="430" font-family="Arial, Helvetica, sans-serif">
<title>Band diagram of an n-type Si bar with a voltage across it</title>
<desc>The bar is 0.4 cm long. All the bands slope down from left to right. The conduction band is 1.2 eV higher at the left end than at the right end. The Fermi level is close to the conduction band and tilts with it.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="1" y="1" width="678" height="428" rx="14" fill="#ffffff" stroke="#d5dcea"/>
<line x1="110" y1="80" x2="520" y2="200" stroke="#1a2540" stroke-width="2.5"/><line x1="110" y1="104" x2="520" y2="224" stroke="#d9730d" stroke-width="3.5"/><line x1="110" y1="215" x2="520" y2="335" stroke="#1a2540" stroke-width="2.5"/>
<text x="98" y="86" font-size="17" fill="#1a2540" font-weight="400" text-anchor="end">E<tspan baseline-shift="sub" font-size="11">C</tspan></text><text x="98" y="112" font-size="17" fill="#b45309" font-weight="700" text-anchor="end">E<tspan baseline-shift="sub" font-size="11">F</tspan></text><text x="98" y="221" font-size="17" fill="#1a2540" font-weight="400" text-anchor="end">E<tspan baseline-shift="sub" font-size="11">V</tspan></text>
<line x1="110" y1="80" x2="570" y2="80" stroke="#5b6785" stroke-dasharray="5 4"/><line x1="520" y1="200" x2="570" y2="200" stroke="#5b6785" stroke-dasharray="5 4"/><line x1="560" y1="83" x2="560" y2="197" stroke="#2563eb" stroke-width="1.8" marker-start="url(#a)" marker-end="url(#a)"/><text x="570" y="146.0" font-size="16" fill="#2563eb">1.2 eV</text>
<rect x="110" y="343" width="410" height="44" rx="6" fill="#e8eefb" stroke="#1a2540" stroke-width="1.2"/><text x="315.0" y="371" text-anchor="middle" font-size="16" fill="#1a2540">n-Si bar</text><rect x="84" y="343" width="20" height="44" rx="3" fill="#cfd6e4" stroke="#1a2540" stroke-width="1.2"/><rect x="526" y="343" width="20" height="44" rx="3" fill="#cfd6e4" stroke="#1a2540" stroke-width="1.2"/><text x="94" y="333" text-anchor="middle" font-size="18" font-weight="700" fill="#b45309">?</text><text x="536" y="333" text-anchor="middle" font-size="18" font-weight="700" fill="#b45309">?</text><text x="110" y="411" text-anchor="middle" font-size="14" fill="#5b6785">x = 0</text><text x="520" y="411" text-anchor="middle" font-size="14" fill="#5b6785">x = 0.4 cm</text>
</svg>
