<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 445" width="680" height="445" font-family="Arial, Helvetica, sans-serif">
<title>Answer: sample A (p-type) and sample B (n-type) on one energy axis before contact</title>
<desc>One shared vacuum level. Both samples have the conduction band 4.05 eV below it. Sample B, n-type, has its Fermi level 0.19 eV below the conduction band, so its workfunction is 4.24 eV. Sample A, p-type, has its Fermi level 0.19 eV above the valence band, so its workfunction is 4.98 eV.</desc>
