<rect x="1" y="1" width="678" height="443" rx="14" fill="#ffffff" stroke="#d5dcea"/>
<line x1="60" y1="50" x2="600" y2="50" stroke="#1a2540" stroke-width="2.5"/><text x="606" y="56" font-size="16" fill="#1a2540" font-weight="400" text-anchor="start">E<tspan baseline-shift="sub" font-size="11">vac</tspan></text><line x1="80" y1="284.9" x2="280" y2="284.9" stroke="#1a2540" stroke-width="2.5"/><line x1="80" y1="349.86" x2="280" y2="349.86" stroke="#1a2540" stroke-width="2.5"/><line x1="80" y1="295.91999999999996" x2="280" y2="295.91999999999996" stroke="#d9730d" stroke-width="3.5"/><line x1="110" y1="53" x2="110" y2="281.9" stroke="#2563eb" stroke-width="1.8" marker-start="url(#a)" marker-end="url(#a)"/><text x="118" y="157.45" font-size="15" fill="#2563eb">χ = 4.05</text><line x1="210" y1="53" x2="210" y2="292.91999999999996" stroke="#b45309" stroke-width="1.8" marker-start="url(#a)" marker-end="url(#a)"/><text x="218" y="202.95999999999998" font-size="15" fill="#b45309" font-weight="700">φ = 4.24</text><text x="286" y="289.9" font-size="15" fill="#1a2540" font-weight="400" text-anchor="start">E<tspan baseline-shift="sub" font-size="10">C</tspan></text><text x="286" y="312.91999999999996" font-size="15" fill="#b45309" font-weight="700" text-anchor="start">E<tspan baseline-shift="sub" font-size="10">F</tspan></text><text x="286" y="354.86" font-size="15" fill="#1a2540" font-weight="400" text-anchor="start">E<tspan baseline-shift="sub" font-size="10">V</tspan></text><text x="180.0" y="387.86" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2540">B: n-Si</text>
