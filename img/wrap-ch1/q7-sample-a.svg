<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" font-family="Arial, Helvetica, sans-serif">
<title>Sample A band diagram with the vacuum level</title>
<desc>Vacuum level at the top. The conduction band is 4.05 eV below it. The band gap is 1.12 eV. The Fermi level sits 0.19 eV above the valence band. Not to scale.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="1" y="1" width="678" height="398" rx="14" fill="#ffffff" stroke="#d5dcea"/>
<line x1="150" y1="60" x2="430" y2="60" stroke="#1a2540" stroke-width="2.5"/><line x1="150" y1="200" x2="430" y2="200" stroke="#1a2540" stroke-width="2.5"/><line x1="150" y1="335" x2="430" y2="335" stroke="#1a2540" stroke-width="2.5"/><line x1="150" y1="300" x2="430" y2="300" stroke="#d9730d" stroke-width="3.5"/>
<text x="440" y="66" font-size="17" fill="#1a2540" font-weight="400" text-anchor="start">E<tspan baseline-shift="sub" font-size="11">vac</tspan></text><text x="440" y="206" font-size="17" fill="#1a2540" font-weight="400" text-anchor="start">E<tspan baseline-shift="sub" font-size="11">C</tspan></text><text x="440" y="341" font-size="17" fill="#1a2540" font-weight="400" text-anchor="start">E<tspan baseline-shift="sub" font-size="11">V</tspan></text><text x="440" y="306" font-size="17" fill="#b45309" font-weight="700" text-anchor="start">E<tspan baseline-shift="sub" font-size="11">F</tspan></text>
<line x1="190" y1="63" x2="190" y2="197" stroke="#2563eb" stroke-width="1.8" marker-start="url(#a)" marker-end="url(#a)"/><text x="200" y="136.0" font-size="16" fill="#2563eb">χ = 4.05 eV</text><line x1="270" y1="203" x2="270" y2="332" stroke="#1a2540" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/><text x="280" y="256.0" font-size="16" fill="#1a2540">E<tspan baseline-shift="sub" font-size="11">G</tspan> = 1.12 eV</text><line x1="390" y1="303" x2="390" y2="332" stroke="#b45309" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/><text x="472" y="337.5" font-size="15" fill="#b45309">0.19 eV</text><line x1="470" y1="331.5" x2="396" y2="317.5" stroke="#b45309" stroke-width="1" stroke-dasharray="3 3"/><text x="290.0" y="375" text-anchor="middle" font-size="15" fill="#5b6785">Sample A, Si at 300 K (not to scale)</text>
</svg>
