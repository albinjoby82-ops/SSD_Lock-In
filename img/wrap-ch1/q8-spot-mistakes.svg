<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360" font-family="Arial, Helvetica, sans-serif">
<title>A student's band diagram of n-type Si, with mistakes</title>
<desc>Labelled n-type Si. The Fermi level is drawn near the valence band. The dashed intrinsic level is drawn near the conduction band. The band gap arrow runs from the conduction band to the Fermi level.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="1" y="1" width="678" height="358" rx="14" fill="#ffffff" stroke="#d5dcea"/>
<text x="320.0" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2540">Student's sketch: n-type Si</text>
<line x1="170" y1="80" x2="470" y2="80" stroke="#1a2540" stroke-width="2.5"/><line x1="170" y1="112" x2="470" y2="112" stroke="#1a2540" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.75"/><line x1="170" y1="238" x2="470" y2="238" stroke="#d9730d" stroke-width="3.5"/><line x1="170" y1="270" x2="470" y2="270" stroke="#1a2540" stroke-width="2.5"/>
<text x="480" y="86" font-size="17" fill="#1a2540" font-weight="400" text-anchor="start">E<tspan baseline-shift="sub" font-size="11">C</tspan></text><text x="480" y="118" font-size="15" fill="#1a2540" font-weight="400" text-anchor="start">E<tspan baseline-shift="sub" font-size="10">i</tspan></text><text x="480" y="244" font-size="17" fill="#b45309" font-weight="700" text-anchor="start">E<tspan baseline-shift="sub" font-size="11">F</tspan></text><text x="480" y="276" font-size="17" fill="#1a2540" font-weight="400" text-anchor="start">E<tspan baseline-shift="sub" font-size="11">V</tspan></text>
<line x1="230" y1="83" x2="230" y2="235" stroke="#1a2540" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/><text x="240" y="171.0" font-size="17" fill="#1a2540" font-weight="400" text-anchor="start">E<tspan baseline-shift="sub" font-size="11">G</tspan></text>
<text x="320.0" y="320" text-anchor="middle" font-size="15" fill="#5b6785">There are 3 mistakes. Find them.</text>
</svg>
