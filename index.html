<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="description" content="EEEN20070 Solid State Devices midterm practice: tutorial questions, midterm-style questions and mock midterms with worked answers.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script>
  // always load the newest CSS/JS (GitHub Pages caches files for 10 minutes)
  window.__v = Date.now();
  document.write('<link rel="stylesheet" href="site/style.css?v=' + window.__v + '">');
</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232563eb'/><text x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'>Si</text></svg>">

<body>
<header class="topbar">
  <a class="brand" href="#/">
    <span class="logo">Si</span>
    <span class="brand-text"><b>SSD Lock-In</b><small>Midterm practice</small></span>
  </a>
  <nav class="tools">
    <button class="tool" id="btn-formulas" title="Formula sheet (given in the exam)">📄 <span>Formula sheet</span></button>
    <button class="tool" id="btn-smaller" title="Smaller text" aria-label="Smaller text">A−</button>
    <button class="tool" id="btn-bigger" title="Bigger text" aria-label="Bigger text">A+</button>
    <button class="tool" id="btn-theme" title="Light / dark" aria-label="Toggle dark mode">☾</button>
  </nav>
</header>

<main id="app" class="wrap">
  <p class="loading">Loading questions…</p>
</main>

<aside id="notes" class="notes" hidden aria-label="Notes and formula sheet">
  <div class="pane-top">
    <div class="seg" id="pane-tabs">
      <button data-tab="notes" class="on">Notes</button>
      <button data-tab="formula-sheet.md">Formula sheet</button>
      <button data-tab="periodic-table.md">Periodic table</button>
    </div>
    <button class="ntool" id="notes-close" aria-label="Close panel">✕</button>
  </div>
  <div class="pane-view" id="notes-view">
    <div class="notes-head">
      <b id="notes-title">Notes</b>
      <select id="notes-jump" aria-label="Jump to a section"></select>
    </div>
    <div class="notes-chips" id="notes-chips"></div>
    <div class="notes-body md" id="notes-body"></div>
  </div>
  <div class="pane-view" id="doc-view" hidden>
    <div class="notes-body md" id="doc-body"></div>
  </div>
</aside>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
